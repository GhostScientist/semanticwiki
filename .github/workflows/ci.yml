name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the `engines.node` floor in package.json and the current LTS.
        node-version: ['24.x', '26.x']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Several dependencies (faiss-node, node-llama-cpp, onnxruntime-node, sharp)
      # ship native binaries and run install scripts that fetch large prebuilds.
      # Neither `tsc` nor the test suite executes them, so skipping the scripts
      # keeps CI fast and avoids failures unrelated to this repository's code.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: CLI and package contracts
        run: npm run check:cli

      - name: Check published contents
        run: npm pack --dry-run --ignore-scripts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Report all advisories (informational)
        if: always()
        run: npm audit || true
