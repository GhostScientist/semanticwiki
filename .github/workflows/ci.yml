name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the `engines.node` floor in package.json and the current LTS.
        node-version: ['20.19', '22.x']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Several dependencies (faiss-node, node-llama-cpp, onnxruntime-node, sharp)
      # ship native binaries and run install scripts that fetch large prebuilds.
      # Neither `tsc` nor the test suite executes them, so skipping the scripts
      # keeps CI fast and avoids failures unrelated to this repository's code.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      # Gate on `critical` rather than `high`: `@huggingface/transformers` pins
      # `sharp@^0.34`, which carries an unfixed high-severity libvips advisory
      # (GHSA-f88m-g3jw-g9cj). SemanticWiki only uses transformers for text
      # embeddings and never decodes images, so it is tracked, not blocking.
      - name: npm audit
        run: npm audit --audit-level=critical

      - name: Report all advisories (informational)
        if: always()
        run: npm audit || true
